    { name = "datasets", marker = "extra == 'openwebtext'", specifier = ">=2.14" },
    { name = "equinox", specifier = ">=0.13.0" },
    { name = "jax", specifier = ">=0.5.0" },
    { name = "jaxtyping", specifier = ">=0.2.23" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "optax", specifier = ">=0.2.3" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "tiktoken", marker = "extra == 'openwebtext'", specifier = ">=0.5" },
    { name = "tqdm", specifier = ">=4.66" },
    { name = "wandb", specifier = ">=0.18" },
]
provides-extras = ["openwebtext"]
