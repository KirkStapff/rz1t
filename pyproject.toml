[project]
name = "rz1t"
version = "0.1.0"
description = "Recurrent-depth Z1T: quality–storage experiments under sparse software constraints"
requires-python = ">=3.12,<3.14"
dependencies = ["z1t==0.0.1", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
prepare = ["tiktoken==0.12.0"]
cuda = ["jax[cuda12]>=0.5; sys_platform == 'linux'"]

[tool.uv.sources]
z1t = { path = "upstream/research/z1t", editable = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rz1t*", "runpod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
